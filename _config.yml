# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing these this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Mariku's Notes
title_ja: まりくの雑記
author: Mariku Kimoto
author_ja: 木本 真理究
email: mariku@boussejra.com
description: >
  Mariku Kimoto's personal website, where I write about whatever is on my mind.
  I used to write mostly about software engineering and language learning.
description_ja: >
  木本 真理究(まりく)の個人サイトです。気になったことをいろいろ書いています。ソフトウェア開発・言語学習などについて書いていた時期もあります。ご精読ありがとうございます。
bio: >
  Technical founder interested in developer infrastructure and supply chain security.
  Also a beekeeper with a PhD in Computer Science.
bio_ja: >
  テクニカルファウンダーで、開発者向けのインフラやサプライチェーンセキュリティに関心があります。また、在来種ミツバチの養蜂家でもあり、コンピュータサイエンスの博士号も保有しています。
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://boussejra.com" # the base hostname & protocol for your site
twitter_username: kimoto_mariku
github_username:  malikolivier
linkedin_username: mariku-kimoto-181414113
links:
  - name: StableBuild
    url: https://www.stablebuild.com/
    url_ja: https://stablebuild.jp/
  - name: Kimoto Kinoko
    name_ja: 木本きのこ
    url: https://kimoto-kinoko.jp/
  - name: Kimoto Kinoko honey shop
    name_ja: はちみつオンラインショップ
    url: https://kimotokinoko.theshop.jp/
disqus:
    shortname: boussejra

# Build settings
markdown: kramdown
theme: minima
exclude:
  - CLAUDE.md
  - CNAME
  - Gemfile
  - Gemfile.lock
  - vendor

languages:
    en:
        name: English
        url: ''
        key: en
    ja:
        name: 日本語
        url: ja
        key: ja
gems:
  - jekyll-redirect-from
  - jekyll-sitemap

defaults:
  - scope:
      path: "rust-doc"
    values:
      sitemap: false
