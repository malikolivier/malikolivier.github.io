---
layout: default-ja
---
<article class="post" itemscope itemtype="http://schema.org/BlogPosting">

  <header class="post-header">
    <h1 class="post-title" itemprop="name headline">{{ page.title | escape }}</h1>
    <p class="post-meta"><time datetime="{{ page.date | date_to_xmlschema }}" itemprop="datePublished">{{ page.date | date: "%Y年%_m月%e日" }}</time>{% if page.author %} • <span itemprop="author" itemscope itemtype="http://schema.org/Person"><span itemprop="name">{{ page.author }}</span></span>{% endif %}</p>
  </header>

  <div class="post-content" itemprop="articleBody">
    {{ content }}
  </div>

  <div class="share-page">
    <i class="fa fa-share-alt"></i>
    SNSでシェア &rarr;
    <a href="https://twitter.com/intent/tweet?text={{ page.title | cgi_escape }}&amp;url={{ page.url | prepend: site.url | cgi_escape }}&amp;via={{ site.twitter_username }}&amp;related={{ site.twitter_username }}" rel="nofollow" target="_blank" title="ツイッターでシェア"><i class="fa fa-twitter"></i></a>
    <a href="https://facebook.com/sharer.php?u={{ page.url | prepend: site.url | cgi_escape }}" rel="nofollow" target="_blank" title="Facebookでシェア"><i class="fa fa-facebook-official"></i></a>
  </div>

  {% if site.disqus.shortname %}
    {% include disqus_comments.html %}
    <script>
    var disqus_config = function () {
        this.language = "ja";
    };
    </script>
  {% endif %}
</article>
